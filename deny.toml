# cargo-deny 配置 —— 只对**真实构建图**做安全审计
#
# 关键设计：targets 只留 Windows。
#   Cargo.lock 是跨平台合并的，里面躺着 glib / zbus / rustls 这些
#   在 Windows 上根本不参与编译的 crate。审计它们只会制造假阳性，
#   最后逼得人把所有告警都 ignore 掉——那这门禁就废了。
#
# 已验证（2026-10-19）：Windows 目标实编译 314 个 crate；
#   lockfile 里 17 条 advisory 名字命中，其中 12 条不在该图内。

[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# 每条 ignore 都必须写 reason，并且写清"什么时候能删"。
#
# 2026-11-10 清理：原来这里有 5 条 unic-* 的 unmaintained（tauri-utils → urlpattern 传入）。
# 现在的依赖图里已经**没有 unic-*** 了（tauri 换掉了 urlpattern），cargo-deny 每次都在报
# `advisory-not-detected`（忽略了一条根本不存在的公告）—— 按"忽略只在为真时才成立"的规矩删掉这 5 条。
ignore = [
  { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 自带 SQLite 3.46.0 的 CVE-2026-119375（页大小不一致的 -wal 导致信息泄露，CVSS 6.8，本地、需打开被构造的文件对）。**升不动**：libsqlite3-sys 由 sqlx 0.9 固定为 0.30（修复版 0.39 要 sqlx 换代），本机/CI 也装不了替代实现。已加运行期防线 src-tauri/src/db_guard.rs（打开库前比对 -wal 与主库页大小，不一致直接拒绝）。**sqlx 升到带 libsqlite3-sys ≥0.39 的版本后，删掉这条 ignore 和 db_guard 的注释引用**" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# 这三条是为了挡住"从 git / 本地路径拉依赖"这类不可复现、不可审计的来源
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"