[package]
name = "app"
version = "3.1.0"
description = "Story-Weaver（织梦机）· AI 剧情创作工具 后端"
authors = ["gu-chen-xi"]
license = "CC-BY-NC-SA-4.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros"] }
tokio = { version = "1", features = ["full"] }
keyring = "2.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
# 直接依赖 png：读回与写回 PNG 的文本块（保住服务商写入的隐式标识；见 image_stamp.rs）
png = "0.18"
# 分支 id 用 UUID（uuid 已在 Tauri 的依赖树里，加为直接依赖不新增下载）
uuid = { version = "1", features = ["v4"] }

# ⚠⚠ 这个 [features] 段是**必须的**，不要删！ ⚠⚠
#
# Tauri 用 `custom-protocol` 特性来判断"这是打包版还是开发版"：
#     tauri/build.rs:  let custom_protocol = has_feature("custom-protocol");
#                      let dev = !custom_protocol;          // 没开 → 认为是 dev
#     tauri-codegen:   } else if dev && config.build.dev_url.is_some() {
#                          // 于是把前端地址写成 devUrl（http://localhost:5173）
#
# **它看的是"有没有这个特性"，不是看 debug/release！**
# 所以缺了它，`cargo build --release` 出来的 exe 依然会去连 localhost:5173 ——
# 没有 vite 服务时页面就报"localhost 拒绝连接"（实测踩到：三种启动方式全部打不开）。
#
# `npm run tauri dev` 不带这个特性 → 走 devUrl（正确）
# `tauri build`          带这个特性 → 走 frontendDist（内嵌资源，正确）
[features]
# 默认**不启用**，这样 `cargo build`（debug）仍然配合 `npm run tauri dev` 使用。
default = []
# 打包/独立运行时启用：把前端资源内嵌进 exe。
# 用法： cargo build --release --features custom-protocol
#   （或直接用 `npm run tauri build`，它会自动加上）
custom-protocol = ["tauri/custom-protocol"]

# 开发/测试构建不带调试信息。
# 起因（2026-10-18）：target\debug 涨到 58.8 GB（deps 42G + incremental 12.8G），
# 全是历次 `cargo test` 累积的测试二进制 —— 每个都静态链接了 sqlx/tauri，带完整 debuginfo。
# 这个项目不做 Rust 单步调试（靠测试 + 日志），所以 debug=0 是纯赚：
# 编译更快、链接更快、体积小一个数量级；需要调试时临时改成 1 即可。
[profile.dev]
debug = 0
