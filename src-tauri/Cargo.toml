[package]
name = "app"
version = "2.1.0"
description = "Story-Weaver（织梦机）· AI 剧情创作工具 后端"
authors = ["gu-chen-xi"]
license = "CC-BY-NC-SA-4.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros"] }
tokio = { version = "1", features = ["full"] }
keyring = "2.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
# 直接依赖 png：读回与写回 PNG 的文本块（保住服务商写入的隐式标识；见 image_stamp.rs）
png = "0.18"
